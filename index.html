<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Exam Scanner Pro - Auto Document Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>📄 Exam Scanner Pro</h1>
        <div class="camera-wrapper">
            <video id="cameraFeed" autoplay playsinline muted></video>
            <canvas id="outlineCanvas"></canvas> <!-- For drawing document outline -->
        </div>

        <div class="controls">
            <button id="scanPage1Btn" class="btn primary" disabled>📸 Page 1 Captured</button>
            <button id="scanPage2Btn" class="btn secondary" disabled>📸 Page 2</button>
            <button id="submitBtn" class="btn success" disabled>✨ Send to Gemini AI</button>
            <button id="resetBtn" class="btn reset" style="background:#f1f3f4; color:#5f6368;">⟳ Reset</button>
        </div>

        <div id="status" class="status">🔍 Initializing camera...</div>
        <div id="guidanceMsg" class="guidance"></div>
        <div id="result" class="result" style="display:none;"></div>
    </div>

    <!-- Document AutoCapture SDK -->
    <script src="https://unpkg.com/js-document-autocapture/dist/index.js"></script>
    <script src="script.js"></script>
</body>
</html>
