<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Exam Scanner Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="camera-container">
        <video id="cameraFeed" autoplay playsinline muted></video>
        
        <!-- Bottom Tab Bar -->
        <div class="bottom-tab-bar">
            <button id="scanPage1Btn" class="tab-btn primary">
                <span class="icon">📸</span>
                <span class="label">Page 1</span>
            </button>
            <button id="scanPage2Btn" class="tab-btn secondary" disabled>
                <span class="icon">📄</span>
                <span class="label">Page 2</span>
            </button>
            <button id="submitBtn" class="tab-btn success" disabled>
                <span class="icon">✨</span>
                <span class="label">Extract</span>
            </button>
            <button id="resetBtn" class="tab-btn reset">
                <span class="icon">⟳</span>
                <span class="label">Reset</span>
            </button>
            <!-- Upload button -->
            <label id="uploadBtn" class="tab-btn upload">
                <span class="icon">📁</span>
                <span class="label">Upload</span>
                <input type="file" id="uploadInput" accept="image/jpeg,image/png,image/jpg" style="display: none;">
            </label>
        </div>
    </div>

    <!-- Simple status bar -->
    <div id="statusMsg" class="status-bar">📷 Ready</div>

    <!-- Full-screen modal for answers -->
    <div id="resultModal" class="result-modal hidden">
        <div class="modal-header">
            <h3>📝 Extracted Q&A</h3>
            <button id="closeModalBtn" class="close-modal">✕</button>
        </div>
        <div class="modal-body">
            <pre id="resultText"></pre>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
