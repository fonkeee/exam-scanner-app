<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Exam Scanner • Dark Mode</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="camera-container">
        <video id="cameraFeed" autoplay playsinline muted></video>
        
        <!-- Bottom Tab Bar -->
        <div class="bottom-tab-bar">
            <button id="scanPage1Btn" class="tab-btn primary">
                <span class="icon">📸</span>
                <span class="label">Page 1</span>
            </button>
            <button id="scanPage2Btn" class="tab-btn secondary" disabled>
                <span class="icon">📄</span>
                <span class="label">Page 2</span>
            </button>
            <button id="submitBtn" class="tab-btn success" disabled>
                <span class="icon">✨</span>
                <span class="label">Extract</span>
            </button>
            <button id="resetBtn" class="tab-btn reset">
                <span class="icon">⟳</span>
                <span class="label">Reset</span>
            </button>
        </div>
    </div>

    <!-- Status overlays (toast style) -->
    <div id="statusToast" class="status-toast">📷 Ready</div>
    <div id="qualityToast" class="quality-toast"></div>
    <div id="resultPanel" class="result-panel hidden">
        <div class="result-header">
            <span>📝 Extracted Q&A</span>
            <button id="closeResultBtn" class="close-btn">✕</button>
        </div>
        <div id="resultContent" class="result-content"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
